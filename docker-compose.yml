version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_portal_postgres
    environment:
      POSTGRES_DB: job_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: job_portal_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: job_portal_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-compose-secret-key-development
      - ALLOWED_HOSTS=*
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
